global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Haute dispo : les DEUX passerelles sont scrapées sous le même job « gateway ».
  # Les agrégats (sum by job) couvrent donc le trafic, quel que soit le nœud qui sert.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080", "gateway-backup:8080"]

  - job_name: detector
    metrics_path: /metrics
    static_configs:
      - targets: ["detector:8000"]

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
