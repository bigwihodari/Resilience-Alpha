global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # La passerelle expose les métriques de trafic (http_requests_total,
  # http_request_duration_seconds, waf_blocked_total). C'est la source principale.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  # Détection d'anomalies par IA (anomaly_score / anomaly_flag / detector_trained).
  - job_name: detector
    metrics_path: /metrics
    static_configs:
      - targets: ["detector:8000"]

  # Moteur de remédiation (remediation_active).
  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8000"]

  # Métriques CPU / mémoire des conteneurs (exposé en interne uniquement).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
