# Reverse-proxy de BASCULE (haute disponibilité) devant deux passerelles.
# Le principal (gateway) sert le trafic ; si injoignable (error/timeout/5xx), nginx
# bascule AUTOMATIQUEMENT sur le secours (gateway-backup) et y revient dès que le
# principal répond de nouveau. C'est le point d'entrée public (port 8080).
upstream rg_gateways {
    server gateway:8080 max_fails=1 fail_timeout=3s;
    server gateway-backup:8080 backup;
}

server {
    listen 80;
    server_name _;

    # Santé du proxy HA lui-même (indépendant des passerelles).
    location = /ha-health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"ha-proxy"}';
    }

    location / {
        proxy_pass http://rg_gateways;
        # Bascule sur le secours si le principal échoue (POST compris : non_idempotent).
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Expose quel backend a réellement servi (diagnostic de bascule).
        add_header X-RG-Upstream $upstream_addr always;
    }
}
