server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolveur DNS interne de Docker : permet un proxy_pass par variable, qui ne fait
    # PAS échouer nginx au démarrage si une cible n'existe pas (mode sans HA). Les
    # routes /ha/* répondent alors simplement 502, et le cockpit l'affiche « indispo ».
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Haute disponibilité : santé par nœud (le cockpit lit quel nœud sert) ---
    location = /ha/entry   { set $u http://ha-proxy:80/health;        proxy_pass $u; proxy_connect_timeout 2s; }
    location = /ha/primary { set $u http://gateway:8080/health;       proxy_pass $u; proxy_connect_timeout 2s; }
    location = /ha/backup  { set $u http://gateway-backup:8080/health; proxy_pass $u; proxy_connect_timeout 2s; }

    # Prometheus (lecture seule) : alimente les KPI et les graphes du cockpit.
    location /prom/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
    }
    # Orchestrateur de remédiation (état + timeline).
    location /orch/ {
        proxy_pass http://orchestrator:8000/;
        proxy_set_header Host $host;
    }
    # Détecteur ML (état détaillé).
    location /det/ {
        proxy_pass http://detector:8000/;
        proxy_set_header Host $host;
    }
    # Assistant RAG (réponse du LLM local : timeout large).
    location /assistant/ {
        proxy_pass http://assistant:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
