server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prometheus (lecture seule) : alimente les KPI et les graphes du cockpit.
    location /prom/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
    }
    # Orchestrateur de remédiation (état + timeline).
    location /orch/ {
        proxy_pass http://orchestrator:8000/;
        proxy_set_header Host $host;
    }
    # Détecteur ML (état détaillé).
    location /det/ {
        proxy_pass http://detector:8000/;
        proxy_set_header Host $host;
    }
    # Assistant RAG (réponse du LLM local : timeout large).
    location /assistant/ {
        proxy_pass http://assistant:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
