name: resilience-alpha-client

# Application CLIENT — à déployer sur un poste client (CLIENT-A, CLIENT-B).
# Se connecte au serveur HOST ; ne contient que login + paiement + recherche.

services:
  client:
    build: ./app
    container_name: ra-client
    environment:
      # Serveur principal (en labo : 192.168.137.1, ports 8000/8001).
      HOST_PRIMARY: ${HOST_PRIMARY:-host.docker.internal}
      HOST_PRIMARY_API_PORT: ${HOST_PRIMARY_API_PORT:-8000}
      HOST_PRIMARY_AUTH_PORT: ${HOST_PRIMARY_AUTH_PORT:-8001}
      # Serveur de secours. Labo : 192.168.137.2 (stack complète, 8000/8001).
      # Test local : host.docker.internal, ports décalés 8010/8011.
      HOST_BACKUP: ${HOST_BACKUP:-host.docker.internal}
      HOST_BACKUP_API_PORT: ${HOST_BACKUP_API_PORT:-8000}
      HOST_BACKUP_AUTH_PORT: ${HOST_BACKUP_AUTH_PORT:-8001}
      # N'autorise envsubst que sur les variables HOST_* (préserve $host nginx).
      NGINX_ENVSUBST_FILTER: "HOST_"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CLIENT_PORT:-8095}:80"
    restart: unless-stopped
