global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # La détection ML (P4) exposera son score ici.
  - job_name: detector
    metrics_path: /metrics
    static_configs:
      - targets: ["detector:8000"]
