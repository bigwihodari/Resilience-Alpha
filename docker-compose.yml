name: resilience-alpha

services:
  db:
    image: postgres:16-alpine
    container_name: ra-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilience}
      POSTGRES_DB: ${POSTGRES_DB:-resilience}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resilience}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]
    # DB volontairement NON exposée au réseau pédagogique (règle du sujet).

  auth:
    build: ./services/auth
    container_name: ra-auth
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD:-resilience}@db:5432/${POSTGRES_DB:-resilience}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AUTH_PORT:-8001}:8000"
    networks: [backend]
    restart: unless-stopped

  api:
    build: ./services/api
    container_name: ra-api
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD:-resilience}@db:5432/${POSTGRES_DB:-resilience}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [backend]
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    container_name: ra-frontend
    depends_on:
      - api
      - auth
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [backend]
    restart: unless-stopped

  traffic-gen:
    build: ./services/traffic-gen
    container_name: ra-traffic-gen
    environment:
      API_URL: http://api:8000
      AUTH_URL: http://auth:8000
      TG_INTERVAL: "1.5"
    depends_on:
      - api
      - auth
    networks: [backend]
    restart: unless-stopped

  # ---------- Observabilité (P2) ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ra-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [backend]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: ra-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks: [backend]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: ra-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [backend]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ra-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # Pas de port publié : Prometheus scrape cAdvisor via le réseau interne
    # (cadvisor:8080). Évite tout conflit de port sur les machines de l'équipe.
    expose:
      - "8080"
    networks: [backend]
    restart: unless-stopped

  detector:
    build: ./services/detector
    container_name: ra-detector
    environment:
      PROM_URL: http://prometheus:9090
      INTERVAL: "5"
      WARMUP_SAMPLES: "30"
      CONTAMINATION: "0.02"
    depends_on:
      - prometheus
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [backend]
    restart: unless-stopped

volumes:
  db_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  backend:
    driver: bridge
