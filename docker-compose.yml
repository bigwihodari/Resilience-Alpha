name: resilience-alpha

services:
  db:
    image: postgres:16-alpine
    container_name: ra-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilience}
      POSTGRES_DB: ${POSTGRES_DB:-resilience}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resilience}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]
    # DB volontairement NON exposée au réseau pédagogique (règle du sujet).

  auth:
    build: ./services/auth
    container_name: ra-auth
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD:-resilience}@db:5432/${POSTGRES_DB:-resilience}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password123}
      BANKER_USER: ${BANKER_USER:-banquier}
      BANKER_PASSWORD: ${BANKER_PASSWORD:-password123}
      CANARY_USER: ${CANARY_USER:-canary}
      CANARY_PASSWORD: ${CANARY_PASSWORD:-password123}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-orchestrator-admin-token}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-trusted-token}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AUTH_PORT:-8001}:8000"
    networks: [backend]
    restart: unless-stopped

  api:
    build: ./services/api
    container_name: ra-api
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD:-resilience}@db:5432/${POSTGRES_DB:-resilience}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-orchestrator-admin-token}
      ROLE: ${ROLE:-primary}
      HA_NAME: ${HA_NAME:-PRINCIPAL}
      SAVINGS_RATE: ${SAVINGS_RATE:-0.01}
      SAVINGS_INTERVAL: ${SAVINGS_INTERVAL:-30}
      REPL_TOKEN: ${REPL_TOKEN:-repl-secret}
      # URL de l'api du PAIR pour la haute dispo :
      #  - sur le PRINCIPAL : URL du secours (ex. http://192.168.137.2:8000 ou,
      #    en test local, http://host.docker.internal:8010) -> pour l'affichage cluster.
      #  - sur un host de SECOURS (ROLE=backup) : URL du principal à répliquer.
      # Vide = noeud autonome (pas de pair).
      PEER_API_URL: ${PEER_API_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [backend]
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    container_name: ra-frontend
    security_opt: ["no-new-privileges:true"]
    environment:
      # Secours pour la bascule du cockpit. Défaut = le principal lui-même
      # (no-op) tant qu'aucun vrai host de secours n'est renseigné -> conf valide.
      HOST_BACKUP: ${HOST_BACKUP:-api}
      HOST_BACKUP_API_PORT: ${HOST_BACKUP_API_PORT:-8000}
      HOST_BACKUP_AUTH_PORT: ${HOST_BACKUP_AUTH_PORT:-8000}
      # N'interpole QUE nos variables HOST_BACKUP* (laisse $host etc. de nginx).
      NGINX_ENVSUBST_FILTER: "HOST_BACKUP"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - auth
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [backend]
    restart: unless-stopped

  traffic-gen:
    build: ./services/traffic-gen
    container_name: ra-traffic-gen
    security_opt: ["no-new-privileges:true"]
    environment:
      API_URL: http://api:8000
      AUTH_URL: http://auth:8000
      TG_INTERVAL: "1.5"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-trusted-token}
    depends_on:
      - api
      - auth
    networks: [backend]
    restart: unless-stopped

  # ---------- Observabilité (P2) ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ra-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [backend]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: ra-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks: [backend]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: ra-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [backend]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ra-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # Pas de port publié : Prometheus scrape cAdvisor via le réseau interne
    # (cadvisor:8080). Évite tout conflit de port sur les machines de l'équipe.
    expose:
      - "8080"
    networks: [backend]
    restart: unless-stopped

  detector:
    build: ./services/detector
    container_name: ra-detector
    security_opt: ["no-new-privileges:true"]
    environment:
      PROM_URL: http://prometheus:9090
      INTERVAL: "5"
      WARMUP_SAMPLES: "30"
      CONTAMINATION: "0.02"
      MODEL_PATH: /app/model/detector.joblib
    volumes:
      - detector_model:/app/model
    depends_on:
      - prometheus
    networks: [backend]
    restart: unless-stopped

  orchestrator:
    build: ./services/orchestrator
    container_name: ra-orchestrator
    security_opt: ["no-new-privileges:true"]
    environment:
      DETECTOR_URL: http://detector:8000
      AUTH_URL: http://auth:8000
      API_URL: http://api:8000
      PROM_URL: http://prometheus:9090
      ADMIN_TOKEN: ${ADMIN_TOKEN:-orchestrator-admin-token}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-trusted-token}
      CANARY_USER: ${CANARY_USER:-canary}
      CANARY_PASSWORD: ${CANARY_PASSWORD:-password123}
    depends_on:
      - detector
      - auth
      - api
    networks: [backend]
    restart: unless-stopped

  assistant:
    build: ./services/assistant
    container_name: ra-assistant
    security_opt: ["no-new-privileges:true"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      EMB_MODEL: ${EMB_MODEL:-nomic-embed-text}
      KNOWLEDGE_DIR: /app/knowledge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docs:/app/knowledge/docs:ro
      - ./README.md:/app/knowledge/README.md:ro
      - ./SECURITE.md:/app/knowledge/SECURITE.md:ro
      - ./DEPLOIEMENT.md:/app/knowledge/DEPLOIEMENT.md:ro
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [backend]
    restart: unless-stopped

volumes:
  db_data:
  prometheus_data:
  loki_data:
  grafana_data:
  detector_model:

networks:
  backend:
    driver: bridge
